# One-command local run:  docker compose up --build
#   demo UI     http://localhost:3000
#   GraphQL     http://localhost:8080  (playground)
# Provider keys are read from agent/.env (optional; the "mock" provider needs none).
# The tokens below are local-only placeholders, not secrets.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/shop?sslmode=disable
      API_TOKEN: local-api-token
      ADMIN_TOKEN: local-admin-token
      ALLOW_RESET: "true"
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }

  agent:
    build: ./agent
    env_file:
      - path: ./agent/.env
        required: false
    environment:
      SHOP_API_URL: http://api:8080
      SHOP_API_TOKEN: local-api-token
      SHOP_ADMIN_TOKEN: local-admin-token
      TRACE_DIR: /app/traces
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-mock}
    volumes:
      - ./agent/traces:/app/traces
      - ./agent/eval/results:/app/eval/results
    ports: ["3000:3000"]
    depends_on: [api]
