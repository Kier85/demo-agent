name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - run: go vet ./...
      - run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/shop_test?sslmode=disable

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # End to end: real API + Postgres, rule-based mock provider (no API keys needed).
  e2e:
    runs-on: ubuntu-latest
    needs: [api, agent]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait db api
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: agent
      - run: node eval/run.ts --providers mock --no-kill-switch
        working-directory: agent
        env:
          SHOP_API_TOKEN: local-api-token
          SHOP_ADMIN_TOKEN: local-admin-token
          TRACE_DIR: "off"
